[project]
name = "flowos-duckduckgo"
version = "0.1.1"
description = "DuckDuckGo Search component as a standalone FlowOS Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "FlowOS", email = "contact@flowos.org" },
]
keywords = ["flowos", "flowos_core", "extension", "bundle", "duckduckgo", "search"]

# Runtime deps: flowos_core (the BUNDLE_API surface) and the langchain-community
# binding that wraps the duckduckgo-search Python client.  flowos_core is floored at
# the current major.minor line (>=1.10.0) and capped below the next flowos_core major
# (<2.0.0) so the bundle resolves a compatible flowos_core; fine-grained BUNDLE_API
# compatibility is enforced separately via extension.json's
# "flowos_core": {"compat": [...]} contract.  langchain-community uses the same
# range the flowos_core tree does to keep co-installation lockstep.
dependencies = [
    "flowos-core>=0.1.1",
    "langchain-community>=0.4.1,<1.0.0",
    "ddgs>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/dspraneeth07/FlowOS"
Documentation = "https://github.com/dspraneeth07/FlowOS"
Repository = "https://github.com/dspraneeth07/FlowOS"

# Manifest-shipping distributions are discovered via the
# ``flowos.extensions`` entry-point.  The value is the dotted path
# to the package containing ``extension.json`` -- the loader walks
# ``importlib.metadata.files()`` from there to find the manifest, and
# falls back to this entry-point for editable installs whose dist.files
# only surfaces dist-info entries.
[project.entry-points."flowos.extensions"]
flowos-duckduckgo = "flowos_duckduckgo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the flowos_duckduckgo package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/flowos_duckduckgo"]
include = ["src/flowos_duckduckgo/extension.json", "src/flowos_duckduckgo/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/flowos_duckduckgo",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
