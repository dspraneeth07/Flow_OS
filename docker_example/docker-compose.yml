services:
  flowos:
    # Built from this repo rather than pulled: there is no published FlowOS image
    # on a registry yet, so `image: <org>/flowos:latest` + pull_policy: always
    # would fail with a manifest-not-found on every `docker compose up`.
    # Once you publish an image, swap this `build:` block for `image: <your-org>/flowos:<tag>`.
    build:
      context: ..
      dockerfile: docker/build_and_push.Dockerfile
    image: flowos:local
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - FLOWOS_DATABASE_URL=postgresql://flowos:flowos@postgres:5432/flowos
      - FLOWOS_SUPERUSER_PASSWORD=${FLOWOS_SUPERUSER_PASSWORD:?set FLOWOS_SUPERUSER_PASSWORD in .env}
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - FLOWOS_CONFIG_DIR=/app/flowos
    volumes:
      - flowos-data:/app/flowos

  postgres:
    # Pinned to a specific Debian base (trixie) so the postgres:16 tag does not
    # silently roll its OS underneath us — that roll causes a glibc collation
    # version mismatch warning on existing volumes. Matches the flowos image
    # base. See https://github.com/dspraneeth07/FlowOS
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: flowos
      POSTGRES_PASSWORD: flowos
      POSTGRES_DB: flowos
    ports:
      - "5432:5432"
    volumes:
      - flowos-postgres:/var/lib/postgresql/data

volumes:
  flowos-postgres:
  flowos-data:
